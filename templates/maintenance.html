<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Under Maintenance</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 40px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      border-radius: 12px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      color: #ff6b6b;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .emoji {
      font-size: 60px;
      margin-bottom: 20px;
    }

    .countdown {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #555;
    }

    .footer {
      font-size: 14px;
      color: #999;
    }

    @media (max-width: 600px) {
      h1 { font-size: 36px; }
      p { font-size: 16px; }
      .countdown { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🛠️</div>
    <h1>🧠 EB Products Quote Assistant Under Maintenance</h1>
    <p>We are currently performing maintenance to improve our service.<br>
       Thank you for your patience!</p>
    <div class="countdown" id="countdown">--:--:--</div>
    <div class="footer">– The Technical Team</div>
  </div>

  <script>
    let initialTime = {{ initial_time }};
    let timeLeft = initialTime;

    function formatTime(seconds) {
        const hrs = String(Math.floor(seconds / 3600)).padStart(2,'0');
        const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2,'0');
        const secs = String(seconds % 60).padStart(2,'0');
        return `${hrs}:${mins}:${secs}`;
    }

    function updateCountdown() {
        document.getElementById('countdown').textContent = formatTime(timeLeft);
        timeLeft--;
        if(timeLeft < 0) timeLeft = initialTime;  // reset timer
    }
    setInterval(updateCountdown, 1000);

    // Check maintenance status every 60 seconds
    async function checkMaintenance() {
        try {
            const res = await fetch("/maintenance_status");
            if(res.ok) {
                const data = await res.json();
                if(data.maintenance === false) {
                    location.reload(); // Load normal page
                } else if (data.duration !== initialTime)
                {
                    initialTime = data.duration;
                    
                    if (data.duration < timeLeft)
                    {
                        timeLeft = initialTime
                    }
                }
            }
        } catch(err) {
            console.error("Error checking maintenance status:", err);
        }
    }
    setInterval(checkMaintenance, 60000); // every 60 seconds
  </script>
</body>
</html>
